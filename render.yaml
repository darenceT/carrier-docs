# Render Blueprint. Check field names against Render's Blueprint reference before the first deploy.
services:
  - type: web
    name: carrier-docs
    runtime: docker
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: MAX_SESSIONS
        value: '1'
      - key: QUEUE_WAIT_S
        value: '30'
      - key: DOCUMENT_CACHE_S
        value: '600'
      - key: MFA_TIMEOUT_S
        value: '300'
      - key: PREWARM_TIMEOUT_S
        value: '120'
      - key: SESSION_TTL_DAYS
        value: '7'
      - key: DEMO_CARRIER_ENABLED
        value: 'true'
      - key: PROGRESSIVE_BROWSER
        value: patched-headless
      - key: CARRIER2_BROWSER
        value: patched-headless
      # Login pages /internal/canary loads (never logs in). To check the real carriers, set
      # progressive,lemonade in the dashboard; demo only checks the local mock portal.
      - key: CANARY_CARRIERS
        value: demo
      - key: LOG_LEVEL
        value: info
      # Secrets: Render prompts for these in the dashboard; they never live in the repo.
      - key: SESSION_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: CANARY_TOKEN
        sync: false
