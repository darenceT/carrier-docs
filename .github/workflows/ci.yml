name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main always finish, so every merged
# commit gets a result before Render deploys it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Browser downloads are cached per lockfile; --with-deps still installs the system
      # libraries, which aren't cacheable. Playwright's Chromium runs the tests; patchright's runs
      # inside the app during e2e (the Demo carrier uses the production browser strategy).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx -w apps/server patchright install chromium
      # Adapter and pool tests against a real Chromium and the local mock portal (no network).
      - run: npx vitest run apps/server/test/carriers apps/server/test/browser
        env:
          RUN_BROWSER_TESTS: '1'
      - run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Production dependencies only; fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Render builds its own image from the repo; this one is only checked. Layers are cached in
      # GitHub Actions, so unchanged dependency and browser layers aren't rebuilt.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Loaded under the tag docker-compose.yml uses, for the quick-start check below.
          load: true
          tags: carrier-docs:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The README quick start, verbatim: cp .env.example .env && docker compose up.
      - name: Quick start works from .env.example
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 2; done
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:3000/ | grep -q 'id="root"'
          # Values come from .env, so the workflow holds no token-shaped literals.
          env_value() { grep "^$1=" .env | cut -d= -f2-; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/access \
            -H 'Content-Type: application/json' -d "{\"code\":\"$(env_value ACCESS_CODE)\"}")
          test "$code" = 204
          # The image's patched Chromium loads the mock portal's login page (CANARY_CARRIERS=demo).
          curl -fsS --max-time 60 -X POST localhost:3000/internal/canary \
            -H "Authorization: Bearer $(env_value CANARY_TOKEN)"
      - name: Container logs
        if: failure()
        run: docker compose logs

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
